<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوس بنزين 🏁 | تسجيل الفرق</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #243b55);
      color: white;
    }
    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      background: #ffffff12;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      box-shadow: 0 15px 45px #0004;
    }
    .flag { font-size: 55px; }
    h1 { margin: 12px 0; font-size: 30px; }
    p { color: #d8e2f0; line-height: 1.9; }
    .badge {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 30px;
      background: #ffffff18;
      font-size: 14px;
    }
    .notice {
      margin-top: 22px;
      padding: 12px;
      background: #fbbf2418;
      border-radius: 12px;
      color: #ffe6a0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="flag">🏁 🛣️</div>
    <h1>دوس بنزين</h1>
    <div class="badge">تسجيل الفرق</div>
    <p>
      مستعد تبدأ رحلتك؟ 🚗💨<br>
      هنا هتعرف فريقك ولونه والآية الخاصة بيك.
    </p>
    <div class="notice">
      جاري تجهيز نظام التسجيل الآمن بحساب Google.
    </div>
  </main>
</body>
</html>
