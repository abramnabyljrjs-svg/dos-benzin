<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دوس بنزين 🏁</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#101827,#243b55);color:#fff
}
.card{
  width:100%;max-width:460px;padding:28px 22px;
  background:#ffffff12;border:1px solid #ffffff30;border-radius:22px;text-align:center
}
h1{font-size:30px;margin:10px 0}
p{line-height:1.9;color:#e0e7ff;margin:8px 0}
input,select,button{
  width:100%;padding:14px;margin-top:14px;border-radius:10px;font-size:16px;font-family:inherit
}
input,select{border:1px solid #ddd;background:#fff;color:#111}
button{border:0;background:#fbbf24;color:#222;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
button.secondary{background:#ffffff25;color:#fff}
#msg{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px;min-height:24px}
#result{
  display:none;margin-top:20px;padding:16px;
  background:#ffffff18;border-radius:12px;line-height:2;text-align:right
}
#result .swatch{
  display:inline-block;width:18px;height:18px;border-radius:50%;
  vertical-align:middle;margin-inline-start:6px;border:1px solid #fff
}
#result .verse{
  margin-top:10px;padding:10px;background:#00000030;border-radius:8px;line-height:2
}
[hidden]{display:none !important}
</style>
</head>

<body>

<main class="card">
  <div style="font-size:48px">🏁 🛣️</div>
  <h1>دوس بنزين</h1>
  <p>سجّل واعرف فريقك ولونه والآية الخاصة بيك ❤️</p>

  <button id="login" type="button">تسجيل الدخول بحساب Google</button>

  <div id="form" hidden>
    <p id="email"></p>
    <input id="name" placeholder="اكتب اسمك الرباعي" maxlength="120" autocomplete="off">
    <select id="gender">
      <option value="">اختار النوع</option>
      <option value="ولد">ولد</option>
      <option value="بنت">بنت</option>
    </select>
    <button id="registerBtn" type="button">تسجيل</button>
  </div>

  <div id="msg"></div>
  <div id="result"></div>
  <button id="another" type="button" class="secondary" hidden>تسجيل شخص آخر</button>
</main>

<script>
const API = "https://script.google.com/macros/s/AKfycbxWUVdZw0SMKlvbReDx6-OTK42wy9GtpS28Ak7wNikJbQwTcirkeu-O1lW0hln9EIqa9g/exec";

const ORIGIN_RE = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|script\.google\.com)$/;

let sessionToken = "";
let userEmail = "";
let isAdmin = false;
let busy = false;

const $ = id => document.getElementById(id);

function setMsg(text){ $("msg").textContent = text || ""; }

function newReqId(){
  const a = new Uint8Array(12);
  crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2, "0")).join("");
}

// إرسال طلب إلى Apps Script عبر نموذج داخل iframe وانتظار postMessage
function callApi(fields, timeoutMs){
  timeoutMs = timeoutMs || 60000;

  return new Promise((resolve, reject) => {
    const reqId = newReqId();
    const frameName = "dbframe_" + reqId;

    const frame = document.createElement("iframe");
    frame.name = frameName;
    frame.hidden = true;

    const form = document.createElement("form");
    form.method = "POST";
    form.action = API;
    form.target = frameName;
    form.hidden = true;

    Object.entries(Object.assign({}, fields, { reqId })).forEach(([k, v]) => {
      const input = document.createElement("input");
      input.type = "hidden";
      input.name = k;
      input.value = v;
      form.appendChild(input);
    });

    let timer = null;

    function cleanup(){
      clearTimeout(timer);
      window.removeEventListener("message", handler);
      frame.remove();
      form.remove();
    }

    function handler(e){
      if (!ORIGIN_RE.test(e.origin)) return;
      const d = e.data;
      if (!d || d.type !== "DB_RESPONSE" || d.reqId !== reqId) return;
      cleanup();
      resolve(d.data);
    }

    window.addEventListener("message", handler);

    timer = setTimeout(() => {
      cleanup();
      reject(new Error("لم يصل رد من الخادم. تأكد من الإنترنت وحاول مرة أخرى."));
    }, timeoutMs);

    document.body.appendChild(frame);
    document.body.appendChild(form);
    form.submit();
  });
}

// ---------- تسجيل الدخول ----------
async function startLogin(){
  const btn = $("login");
  btn.disabled = true;
  setMsg("جاري فتح تسجيل الدخول...");

  try {
    const r = await callApi({ action: "begin" });

    if (!r || !r.success || !r.authUrl){
      setMsg((r && r.message) || "تعذر بدء تسجيل الدخول.");
      btn.disabled = false;
      return;
    }

    try { sessionStorage.setItem("db_state", r.state); } catch (_) {}

    location.href = r.authUrl;
  } catch (err) {
    setMsg(err.message);
    btn.disabled = false;
  }
}

$("login").addEventListener("click", startLogin);

// إكمال الدخول بعد الرجوع من Google
async function finishLogin(code, state){
  $("login").hidden = true;
  setMsg("جاري إكمال تسجيل الدخول...");

  let saved = null;
  try { saved = sessionStorage.getItem("db_state"); sessionStorage.removeItem("db_state"); } catch (_) {}

  if (saved && saved !== state){
    setMsg("طلب الدخول غير صالح. اضغط تسجيل الدخول مرة أخرى.");
    $("login").hidden = false;
    return;
  }

  try {
    const r = await callApi({ action: "login", code: code, state: state });

    if (!r || !r.success){
      setMsg((r && r.message) || "تعذر تسجيل الدخول.");
      $("login").hidden = false;
      return;
    }

    sessionToken = r.sessionToken;
    userEmail = r.email;
    isAdmin = !!r.isAdmin;

    $("form").hidden = false;
    $("email").textContent = "الحساب: " + userEmail;
    setMsg("");
  } catch (err) {
    setMsg(err.message);
    $("login").hidden = false;
  }
}

// ---------- التسجيل ----------
async function register(){
  if (busy) return;

  const name = $("name").value.trim();
  const gender = $("gender").value;

  if (name.length < 3 || !gender){
    setMsg("اكتب اسمك واختار النوع.");
    return;
  }

  busy = true;
  $("registerBtn").disabled = true;
  setMsg("جاري التسجيل...");

  try {
    const r = await callApi({
      action: "register",
      payload: JSON.stringify({ name, gender, sessionToken })
    });

    if (!r || !r.success){
      setMsg((r && r.message) || "حدث خطأ أثناء التسجيل.");
      busy = false;
      $("registerBtn").disabled = false;
      return;
    }

    showResult(r);
  } catch (err) {
    setMsg(err.message);
    busy = false;
    $("registerBtn").disabled = false;
  }
}

function showResult(r){
  $("form").hidden = true;

  const box = $("result");
  box.textContent = "";
  box.style.display = "block";

  const title = document.createElement("div");
  title.textContent = "تم التسجيل بنجاح ✓";
  title.style.fontWeight = "bold";
  box.appendChild(title);

  [["الاسم", r.name], ["الفريق", r.team]].forEach(([k, v]) => {
    const d = document.createElement("div");
    d.textContent = k + ": " + v;
    box.appendChild(d);
  });

  const colorLine = document.createElement("div");
  colorLine.appendChild(document.createTextNode("اللون: " + r.color));
  const sw = document.createElement("span");
  sw.className = "swatch";
  sw.style.background = CSS.supports("color", r.color) ? r.color : "transparent";
  colorLine.appendChild(sw);
  box.appendChild(colorLine);

  const verse = document.createElement("div");
  verse.className = "verse";
  verse.textContent = "الآية: " + r.verse;
  box.appendChild(verse);

  setMsg(r.emailSent ? "تم إرسال النتيجة إلى بريدك." : "تم التسجيل، لكن تعذر إرسال البريد.");

  if (isAdmin){
    $("another").hidden = false;
  }
}

$("registerBtn").addEventListener("click", register);

// للأدمن فقط: تسجيل شخص جديد بنفس الجلسة
$("another").addEventListener("click", () => {
  $("result").style.display = "none";
  $("result").textContent = "";
  $("another").hidden = true;
  $("name").value = "";
  $("gender").value = "";
  $("form").hidden = false;
  $("registerBtn").disabled = false;
  busy = false;
  setMsg("");
});

// ---------- عند فتح الصفحة: هل رجعنا من Google؟ ----------
const q = new URLSearchParams(location.search);

if (q.has("code") && q.has("state")){
  const code = q.get("code");
  const state = q.get("state");
  history.replaceState(null, "", location.pathname);
  finishLogin(code, state);
} else if (q.has("error")){
  history.replaceState(null, "", location.pathname);
  setMsg("تم إلغاء تسجيل الدخول. اضغط الزر للمحاولة مرة أخرى.");
}
</script>

</body>
</html>
